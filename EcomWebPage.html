<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- <h1>helloi</h1> -->

    <script>

        let bodyTag = document.querySelector('body')
        console.log(bodyTag)
            async function getData() {
                let res = await fetch('https://dummyjson.com/products')// promise async
                let data = await res.json();
                console.log(data) //{products: Array(30), total: 194, skip: 0, limit: 30}
                console.log(data.products) // [ {} , {} , {} ..30]
                for(let i = 0; i<data.products.length; i++){
                    console.log(data.products[i]) //{}
                    console.log(data.products[i].title) //{}

                    let para = document.createElement('h1') // <h1>  <h1>
                    let imageTag = document.createElement('img'); //<img/>

                        imageTag.src = data.products[i].thumbnail
                        para.innerHTML = data.products[i].title
                        console.log(para)
                        bodyTag.append(imageTag, para)
                }
        }

            getData()
    </script>
</body>
</html>
