<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        img{
            width: 300px;
            height: 300px;
        }
    </style>
</head>
<body>
    <img id="image1" src="https://cdn.pixabay.com/photo/2017/07/24/19/57/tiger-2535888_640.jpg" alt="">

    <!-- <button onclick="handleSwap()">Swap Image</button> -->
    <button onmouseenter="handleSwap()" onmouseleave="handleSwap()">Swap Image</button>

    <img id ="image2" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcREFOzuyp4kJ7SklesiXwj824gMzTAFylVnE-CizOO4wnFf8O02dcpmqxht&s=10" alt="">


    <script>    

    let imageOne = document.querySelector('#image1')
    let imageTwo = document.querySelector('#image2')

    console.log(imageOne)
    console.log(imageTwo)

        function handleSwap(){
            // console.log("running")
            let temp = imageOne.src
            imageOne.src = imageTwo.src;

            imageTwo.src = temp
        }


        let x = 10;
        let y = 5;

        let temp = x;
        x = y 
        y = temp

        console.log(x) //5
        console.log(y) //10


    </script>
</body>
</html>
